<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d3b66" />
    <title>Online Islamic Bookstore</title>
  
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
  </head>
<body class="bg-no-repeat bg-cover bg-center min-h-screen flex flex-col justify-between" style="background-image: url('masjid-maba-D7dD_-C5eaI-unsplash.jpg');">

  <!-- Header -->
  <header class="bg-black/80 backdrop-blur-sm text-white fixed top-0 left-0 w-full z-50 shadow-md h-[100px]">
    <div class="container mx-auto flex items-center justify-between px-6 h-full">
      <a href="/index.html" class="flex items-center ml-5">
        <img src="/kitobhoi-boqizoda-logo.png" alt="Kitobhoi Boqizoda Logo"
             class="h-[70px] sm:h-[70px] md:h-[100px] w-auto object-contain" />
      </a>    
      <div class="hidden md:flex gap-8 items-center text-lg font-medium">
        <a href="/index.html" class="hover:text-yellow-400 transition">Home</a>
        <a href="#categories" class="hover:text-yellow-400 transition">Categories</a>
        <a href="/books.html" class="hover:text-yellow-400 transition">Books</a>
      </div>
      <div class="flex items-center gap-3">
        <input type="text" placeholder="Search..." class="hidden md:block px-3 py-2 rounded-md border border-gray-500 text-black w-52" />
        <button class="hidden md:block bg-yellow-400 text-black px-4 py-2 font-semibold rounded hover:bg-yellow-500 transition">Search</button>
      </div>
    </div>
  </header>

  <!-- Login Form -->
  <main class="flex-grow flex items-center justify-center mt-[120px] mb-10 px-4">
    <div class="bg-white/90 backdrop-blur-lg shadow-2xl rounded-xl p-8 sm:p-10 w-full max-w-md mt-10 mb-10">
      <div class="text-center mb-6">
        <h2 class="text-3xl font-bold text-gray-800">Welcome Back</h2>
        <p class="text-sm text-gray-600">Log in to continue your journey</p>
      </div>

      <form action="#" method="POST" class="space-y-5">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
          <input type="text" id="username" name="username"
                 class="mt-1 w-full px-4 py-2 rounded-md border border-gray-300 focus:ring-2 focus:ring-yellow-400 outline-none transition">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="password" name="password"
                 class="mt-1 w-full px-4 py-2 rounded-md border border-gray-300 focus:ring-2 focus:ring-yellow-400 outline-none transition">
        </div>

        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center text-gray-600">
            <input type="checkbox" class="mr-2">
            Remember me
          </label>
          <a href="/pages/forgot-password.html" class="text-yellow-600 hover:underline">Forgot Password?</a>
        </div>

        <button type="submit"
                class="w-full bg-yellow-400 hover:bg-yellow-500 text-black font-semibold py-2 rounded-md transition">
          Sign In
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-gray-600">
        Don't have an account?
        <a href="register.html" class="text-yellow-600 hover:underline font-medium">Create one</a>
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-[#1e2a38] text-white py-10 px-6">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
      <!-- Left: Logo + Links -->
      <div class="flex flex-col items-center md:items-start">
        <a href="#" class="flex items-center gap-3 mb-4">
          <img src="/kitobhoi-boqizoda-logo.png" alt="Logo" class="h-20 w-auto" />
        </a>
        <div class="flex flex-wrap justify-center md:justify-start gap-x-4 gap-y-2 text-sm text-gray-300">
          <a href="#" class="hover:text-white font-medium">About Us</a>
          <span>|</span>
          <a href="#" class="hover:text-white font-medium">Privacy</a>
          <span>|</span>
          <a href="#" class="hover:text-white font-medium">Advanced Search</a>
          <span>|</span>
          <a href="#" class="hover:text-white font-medium">Contact</a>
          <span>|</span>
          <a href="#" class="hover:text-white font-medium">Library</a>
        </div>
        <p class="text-xs text-gray-400 mt-4">© 2025 Kitobhoi Boqizoda. All rights reserved.</p>
      </div>

      <!-- Right: Social Icons + Payment -->
      <div class="flex flex-col items-center gap-6">
        <div class="flex gap-4">
          <a href="https://instagram.com" target="_blank" class="border border-[#E4405F] rounded-full p-2 transition" title="Instagram">
            <i data-lucide="instagram" class="h-6 w-6 text-[#E4405F]"></i>
          </a>
          <a href="https://twitter.com" target="_blank" class="border border-[#1DA1F2] rounded-full p-2 transition" title="Twitter">
            <i data-lucide="twitter" class="h-6 w-6 text-[#1DA1F2]"></i>
          </a>
        </div>
        <div class="flex gap-3">
          <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/Visa_Logo.png" class="h-6" alt="Visa" />
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/Mastercard-logo.png" class="h-6" alt="Mastercard" />
        </div>
      </div>
    </div>
  </footer>

</body>
</html>
